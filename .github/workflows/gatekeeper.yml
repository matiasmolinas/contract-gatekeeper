name: Contract Gatekeeper CI

on:
  pull_request:
    branches: [main]

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      key_flows: ${{ steps.gate.outputs.key_flows }}
      key_flow_details: ${{ steps.gate.outputs.key_flow_details }}
      selected_tests: ${{ steps.gate.outputs.selected_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      - name: Run Contract Gatekeeper (Millisecond Check)
        id: gate
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # El CLI sale con 1 en REJECTED: se captura para publicar el reporte antes de fallar
          set +e
          REPORT=$(npx tsx src/cli.ts check --base "$BASE_REF" --head HEAD --json)
          STATUS=$?
          set -e
          echo "$REPORT"
          echo "verdict=$(echo "$REPORT" | jq -r '.verdict')" >> "$GITHUB_OUTPUT"
          echo "key_flows=$(echo "$REPORT" | jq -c '.affectedKeyFlows')" >> "$GITHUB_OUTPUT"
          echo "key_flow_details=$(echo "$REPORT" | jq -c '.affectedKeyFlowDetails')" >> "$GITHUB_OUTPUT"
          echo "selected_tests=$(echo "$REPORT" | jq -c '.selectedTests')" >> "$GITHUB_OUTPUT"
          exit $STATUS

  browser-e2e-check:
    needs: contract-gate
    # Solo se ejecuta si el Gatekeeper detectó cambio de frontera o archivo compartido
    if: needs.contract-gate.outputs.verdict == 'ESCALATE_TO_E2E'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Real-Browser Check (ShipGuarde / Playwright) on Affected Key Flows
        env:
          KEY_FLOWS: ${{ needs.contract-gate.outputs.key_flows }}
          KEY_FLOW_DETAILS: ${{ needs.contract-gate.outputs.key_flow_details }}
        run: |
          echo "🟡 Frontera cruzada. Ejecutando verificación de navegador SOLO en los flujos afectados:"
          echo "$KEY_FLOWS"
          # Cada flujo trae dónde empieza (entryUrl) y cómo se ve terminado (done), si la config lo declara
          echo "$KEY_FLOW_DETAILS" | jq -r '.[] | "\(.name): \(.entryUrl // "-") → \(.done // "-")"'

  # Modo sombra (opt-in): con la variable de repositorio GATEKEEPER_SHADOW=1, un FAST_TRACK
  # corre igual la batería completa y deja una línea JSON que dice si el veredicto o la
  # selección de tests se habrían perdido una falla. Solo mide: no cambia el veredicto
  # requerido y nunca bloquea el PR (continue-on-error).
  shadow:
    needs: contract-gate
    if: vars.GATEKEEPER_SHADOW == '1' && needs.contract-gate.outputs.verdict == 'FAST_TRACK'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Gatekeeper verdict
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npx tsx src/cli.ts check --base "$BASE_REF" --head HEAD --json > gatekeeper-verdict.json || true

      - name: Full test suite, regardless of the verdict
        id: suite
        env:
          # Comando de la batería completa; GATEKEEPER_SHADOW_SUITE lo reemplaza
          SUITE: ${{ vars.GATEKEEPER_SHADOW_SUITE || 'npm test' }}
        run: |
          set +e
          bash -c "$SUITE"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record the shadow line
        env:
          SUITE_EXIT: ${{ steps.suite.outputs.exit_code }}
        run: |
          npx tsx src/cli.ts shadow --verdict gatekeeper-verdict.json --suite-exit "${SUITE_EXIT:-1}" --out gatekeeper-shadow.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-shadow
          path: gatekeeper-shadow.jsonl
